name: Refresh Profile

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats, languages & achievements SVGs
        env:
          # Optional: a fine-grained PAT with "Read access to profile" saved as
          # GH_STATS_TOKEN. Without it the default GITHUB_TOKEN is used.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_profile_assets.py --user AtrePramod --output-dir assets

      - name: Rebuild design SVGs and featured projects
        env:
          # Picks up every public repo tagged with the "featured" topic.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/build_design_assets.py

      - name: Commit refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md .github/featured-projects.json
          git diff --cached --quiet || git commit -m "chore: refresh profile stats and projects [skip ci]"
          git push
