name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate violet / cyan contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%237C3AED&color_dots=%23EEEDF7,%23DDD6FE,%23A78BFA,%237C3AED,%235B21B6&color_dots_border=%23E0DCF6
            dist/github-snake-dark.svg?color_snake=%2322D3EE&color_dots=%23161B30,%232E2A5C,%235B3FB0,%238B5CF6,%2322D3EE&color_dots_border=%23283153

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
